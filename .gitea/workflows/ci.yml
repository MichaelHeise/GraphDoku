name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      AVALONIA_TELEMETRY_OPTOUT: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: .NET SDK installieren (Version aus global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Der Rendering-Rauchtest (GraphDoku.App.Tests) rendert headless mit Skia. libSkiaSharp.so aus
      # SkiaSharp.NativeAssets.Linux ist gegen libfontconfig.so.1 gelinkt; ein X-Server wird nicht gebraucht.
      - name: Systembibliothek für Headless-Rendering (fontconfig)
        run: |
          if ldconfig -p | grep -q 'libfontconfig\.so\.1'; then
            echo "libfontconfig.so.1 ist vorhanden."
          else
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends libfontconfig1
          fi

      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'nuget.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GraphDoku.sln

      - name: Build
        run: dotnet build GraphDoku.sln -c Release --no-restore

      - name: Test
        run: dotnet test GraphDoku.sln -c Release --no-build --logger "trx;LogFilePrefix=testergebnisse" --results-directory TestResults

      # Gitea unterstützt actions/upload-artifact@v4 erst ab neueren Versionen; v3 läuft auf allen act_runner-Installationen.
      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: testergebnisse
          path: TestResults/**/*.trx
          if-no-files-found: warn
